name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend (tests y build)
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "Archivos sin formatear:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: go test
        run: go test ./...
